<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/admin}">
<head>
    <title>User Management</title>
    <style>
        :root {
            --primary-color: #0d6efd;
            --primary-dark: #0b5ed7;
            --success-color: #198754;
            --warning-color: #ffc107;
            --danger-color: #dc3545;
            --info-color: #0dcaf0;
        }

        .page-header {
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid #e9ecef;
        }

        .page-header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #2d3a4a;
            margin-bottom: 0.5rem;
        }

        .page-header p {
            color: #6c757d;
            font-size: 1rem;
            margin: 0;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .search-box .form-control {
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 0.65rem 1rem;
            transition: all 0.3s ease;
        }

        .search-box .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
        }

        .search-box .form-control::placeholder {
            color: #adb5bd;
        }

        .btn-group-toolbar {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            border: none;
            font-weight: 600;
            padding: 0.65rem 1.5rem;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--primary-dark), #0a58ca);
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.3);
            transform: translateY(-2px);
        }

        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        .card-header {
            background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
            border-bottom: 1px solid #e9ecef;
            padding: 1.5rem;
        }

        .card-header h5 {
            margin: 0;
            color: #2d3a4a;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .card-body {
            padding: 1.5rem;
        }

        /* Table Styles */
        .table {
            margin: 0;
            font-size: 0.95rem;
        }

        .table thead {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-bottom: 2px solid #dee2e6;
        }

        .table thead th {
            color: #2d3a4a;
            font-weight: 600;
            padding: 1rem;
            border: none;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        .table tbody td {
            padding: 1rem;
            vertical-align: middle;
            border-color: #e9ecef;
        }

        .table tbody tr {
            transition: all 0.2s ease;
        }

        .table tbody tr:hover {
            background-color: #f8f9fa;
            box-shadow: inset 3px 0 0 var(--primary-color);
        }

        .user-name {
            font-weight: 600;
            color: #2d3a4a;
        }

        .user-email {
            color: #6c757d;
            font-size: 0.9rem;
        }

        .badge {
            font-weight: 600;
            padding: 0.4rem 0.75rem;
            border-radius: 6px;
            font-size: 0.8rem;
            display: inline-block;
            margin-right: 0.25rem;
            margin-bottom: 0.25rem;
        }

        .badge.bg-primary {
            background: rgba(13, 110, 253, 0.15) !important;
            color: var(--primary-color);
        }

        .badge.bg-success {
            background: rgba(25, 135, 84, 0.15) !important;
            color: var(--success-color);
        }

        .badge.bg-danger {
            background: rgba(220, 53, 69, 0.15) !important;
            color: var(--danger-color);
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .btn-sm {
            padding: 0.5rem 0.875rem;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 6px;
            transition: all 0.2s ease;
            border: none;
        }

        .btn-edit {
            background: rgba(255, 193, 7, 0.1);
            color: var(--warning-color);
        }

        .btn-edit:hover {
            background: var(--warning-color);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(255, 193, 7, 0.3);
        }

        .btn-delete {
            background: rgba(220, 53, 69, 0.1);
            color: var(--danger-color);
        }

        .btn-delete:hover {
            background: var(--danger-color);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(220, 53, 69, 0.3);
        }

        .btn-back {
            background: rgba(108, 117, 125, 0.1);
            color: #6c757d;
            border: 1px solid #dee2e6;
        }

        .btn-back:hover {
            background: #e9ecef;
            color: #495057;
            border-color: #adb5bd;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
        }

        .empty-state i {
            font-size: 3rem;
            color: #dee2e6;
            margin-bottom: 1rem;
        }

        .empty-state h4 {
            color: #6c757d;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .empty-state p {
            color: #adb5bd;
            margin-bottom: 1.5rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .search-box {
                min-width: auto;
            }

            .btn-group-toolbar {
                flex-direction: column;
            }

            .btn-group-toolbar .btn {
                width: 100%;
            }

            .table {
                font-size: 0.9rem;
            }

            .table thead th,
            .table tbody td {
                padding: 0.75rem 0.5rem;
            }

            .action-buttons {
                flex-direction: column;
                width: 100%;
            }

            .action-buttons .btn {
                width: 100%;
                text-align: center;
            }

            .page-header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div layout:fragment="adminContent">
        <!-- Page Header -->
        <div class="page-header">
            <h1><i class="bi bi-people-fill me-2"></i>User Management</h1>
            <p>Manage system users, roles, and permissions</p>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="search-box">
                <input type="text" class="form-control" id="searchInput" placeholder="Search users by name or email...">
            </div>
            <div class="btn-group-toolbar">
                <a href="/admin/users/new" class="btn btn-primary">
                    <i class="bi bi-person-plus-fill me-2"></i>Add New User
                </a>
            </div>
        </div>

        <!-- Users Table Card -->
        <div class="card">
            <div class="card-header">
                <div class="d-flex justify-content-between align-items-center">
                    <h5><i class="bi bi-list-ul me-2"></i>All Users</h5>
                    <span class="badge bg-light text-dark" th:text="${users.size()} + ' users'"></span>
                </div>
            </div>
            <div class="card-body">
                <div th:if="${users.size() > 0}" class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Roles</th>
                                <th class="text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}">
                                <td>
                                    <div class="user-name" th:text="${user.name}"></div>
                                </td>
                                <td>
                                    <div class="user-email" th:text="${user.email}"></div>
                                </td>
                                <td>
                                    <div th:if="${user.roles.size() > 0}">
                                        <span th:each="role : ${user.roles}" class="badge bg-primary" th:text="${role.name}"></span>
                                    </div>
                                    <div th:unless="${user.roles.size() > 0}">
                                        <span class="text-muted">No roles assigned</span>
                                    </div>
                                </td>
                                <td class="text-center">
                                    <div class="action-buttons">
                                        <a th:href="@{/admin/users/edit/{id}(id=${user.id})}" class="btn btn-sm btn-edit" title="Edit user" sec:authorize="hasRole('ROLE_ADMIN') or hasAuthority('USER_EDIT')">
                                            <i class="bi bi-pencil-square me-1"></i>Edit
                                        </a>
                                        <form th:action="@{/admin/users/delete}" method="post" class="d-inline" onsubmit="return confirm('Are you sure you want to delete this user? This action cannot be undone.');">
                                            <input type="hidden" name="userId" th:value="${user.id}">
                                            <button type="submit" class="btn btn-sm btn-delete" title="Delete user" sec:authorize="hasRole('ROLE_ADMIN') or hasAuthority('USER_DELETE')">
                                                <i class="bi bi-trash me-1"></i>Delete
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Empty State -->
                <div th:unless="${users.size() > 0}" class="empty-state">
                    <i class="bi bi-inbox"></i>
                    <h4>No users found</h4>
                    <p>Get started by creating your first user account.</p>
                    <a href="/admin/users/new" class="btn btn-primary">
                        <i class="bi bi-person-plus-fill me-2"></i>Create User
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Search functionality
        document.getElementById('searchInput').addEventListener('keyup', function() {
            const searchTerm = this.value.toLowerCase();
            const tableRows = document.querySelectorAll('table tbody tr');

            tableRows.forEach(row => {
                const name = row.querySelector('.user-name')?.textContent.toLowerCase() || '';
                const email = row.querySelector('.user-email')?.textContent.toLowerCase() || '';

                if (name.includes(searchTerm) || email.includes(searchTerm)) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
