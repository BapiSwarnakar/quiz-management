<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/admin}">
<head>
    <title>Questions Management</title>
    <style>
        :root {
            --primary-color: #0d6efd;
            --primary-dark: #0b5ed7;
            --success-color: #198754;
            --warning-color: #ffc107;
            --danger-color: #dc3545;
            --info-color: #0dcaf0;
            --border-color: #e9ecef;
            --text-muted: #6c757d;
        }

        .page-header {
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid var(--border-color);
        }

        .page-header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #2d3a4a;
            margin-bottom: 0.5rem;
        }

        .page-header .quiz-name {
            color: var(--primary-color);
            font-weight: 600;
        }

        .page-header p {
            color: var(--text-muted);
            font-size: 1rem;
            margin: 0;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
        }

        .search-box .form-control {
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 0.65rem 1rem;
            transition: all 0.3s ease;
        }

        .search-box .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
        }

        .btn-group-toolbar {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .btn {
            font-weight: 600;
            border: none;
            border-radius: 8px;
            padding: 0.65rem 1.25rem;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--primary-dark), #0a58ca);
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.3);
            transform: translateY(-2px);
            color: white;
        }

        .btn-secondary {
            background: #e9ecef;
            border: 1px solid var(--border-color);
            color: #495057;
        }

        .btn-secondary:hover {
            background: #dee2e6;
            border-color: #adb5bd;
            color: #212529;
        }

        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        .card-header {
            background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
            border-bottom: 1px solid var(--border-color);
            padding: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .card-header h5 {
            margin: 0;
            color: #2d3a4a;
            font-weight: 600;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-body {
            padding: 1.5rem;
        }

        /* Table Styles */
        .table {
            margin: 0;
            font-size: 0.95rem;
        }

        .table thead {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-bottom: 2px solid #dee2e6;
        }

        .table thead th {
            color: #2d3a4a;
            font-weight: 600;
            padding: 1rem;
            border: none;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        .table tbody td {
            padding: 1rem;
            vertical-align: middle;
            border-color: var(--border-color);
        }

        .table tbody tr {
            transition: all 0.2s ease;
        }

        .table tbody tr:hover {
            background-color: #f8f9fa;
            box-shadow: inset 3px 0 0 var(--primary-color);
        }

        .question-content {
            font-weight: 500;
            color: #2d3a4a;
            line-height: 1.5;
        }

        .marks-badge {
            display: inline-block;
            background: rgba(25, 135, 84, 0.1);
            color: var(--success-color);
            padding: 0.35rem 0.75rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* Action Buttons */
        .action-buttons {
            display: flex;
            gap: 0.5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn-sm {
            padding: 0.5rem 0.875rem;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 6px;
            transition: all 0.2s ease;
            border: none;
        }

        .btn-edit {
            background: rgba(255, 193, 7, 0.1);
            color: var(--warning-color);
        }

        .btn-edit:hover {
            background: var(--warning-color);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(255, 193, 7, 0.3);
        }

        .btn-delete {
            background: rgba(220, 53, 69, 0.1);
            color: var(--danger-color);
        }

        .btn-delete:hover {
            background: var(--danger-color);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(220, 53, 69, 0.3);
        }

        /* Question Count Badge */
        .question-count-badge {
            background: linear-gradient(135deg, rgba(13, 110, 253, 0.15), rgba(13, 110, 253, 0.05));
            color: var(--primary-color);
            padding: 0.35rem 0.75rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 600;
            border: 1px solid rgba(13, 110, 253, 0.2);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
        }

        .empty-state i {
            font-size: 3rem;
            color: #dee2e6;
            margin-bottom: 1rem;
        }

        .empty-state h4 {
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .empty-state p {
            color: #adb5bd;
            margin-bottom: 1.5rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .toolbar {
                flex-direction: column;
                align-items: stretch;
            }

            .search-box {
                min-width: auto;
            }

            .btn-group-toolbar {
                flex-direction: column;
            }

            .btn-group-toolbar .btn {
                width: 100%;
                justify-content: center;
            }

            .card-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .card-header h5 {
                width: 100%;
            }

            .card-header .btn {
                width: 100%;
                justify-content: center;
            }

            .table {
                font-size: 0.9rem;
            }

            .table thead th,
            .table tbody td {
                padding: 0.75rem 0.5rem;
            }

            .action-buttons {
                flex-direction: column;
                width: 100%;
            }

            .action-buttons .btn {
                width: 100%;
                justify-content: center;
            }

            .page-header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div layout:fragment="adminContent">
        <!-- Page Header -->
        <div class="page-header">
            <h1>
                <i class="bi bi-question-square me-2"></i>Questions Management
            </h1>
            <p>
                Quiz: <span class="quiz-name" th:text="${quiz.title}"></span>
            </p>
        </div>

        <!-- Toolbar -->
        <div class="toolbar">
            <div class="search-box">
                <input type="text" class="form-control" id="searchInput" placeholder="Search questions...">
            </div>
            <div class="btn-group-toolbar">
                <a th:href="@{/admin/questions/add/{id}(id=${quiz.id})}" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i>Add Question
                </a>
                <a href="/admin/quizzes" class="btn btn-secondary">
                    <i class="bi bi-arrow-left"></i>Back to Quizzes
                </a>
            </div>
        </div>

        <!-- Questions Table Card -->
        <div class="card">
            <div class="card-header">
                <div>
                    <h5><i class="bi bi-list-ul me-2"></i>All Questions</h5>
                </div>
                <span class="question-count-badge" th:text="${quiz.questions.size()} + ' questions'"></span>
            </div>
            <div class="card-body">
                <div th:if="${quiz.questions.isEmpty()}" class="empty-state">
                    <i class="bi bi-inbox"></i>
                    <h4>No questions found</h4>
                    <p>Get started by adding your first question to this quiz.</p>
                    <a th:href="@{/admin/questions/add/{id}(id=${quiz.id})}" class="btn btn-primary">
                        <i class="bi bi-plus-circle"></i>Add Question
                    </a>
                </div>

                <div th:unless="${quiz.questions.isEmpty()}" class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>Question Content</th>
                                <th class="text-center">Marks</th>
                                <th class="text-center">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="question : ${quiz.questions}">
                                <td>
                                    <div class="question-content" th:text="${question.content}">Question Content</div>
                                </td>
                                <td class="text-center">
                                    <span class="marks-badge">
                                        <i class="bi bi-star-fill me-1"></i>
                                        <span th:text="${question.marks}">0</span>
                                    </span>
                                </td>
                                <td class="text-center">
                                    <div class="action-buttons">
                                        <a th:href="@{/admin/questions/edit/{id}(id=${question.id})}" class="btn btn-sm btn-edit" title="Edit question">
                                            <i class="bi bi-pencil-square"></i>Edit
                                        </a>
                                        <form th:action="@{/admin/questions/delete/{id}(id=${question.id})}" method="post" class="d-inline" onsubmit="return confirm('Are you sure you want to delete this question? This action cannot be undone.')">
                                            <button type="submit" class="btn btn-sm btn-delete" title="Delete question">
                                                <i class="bi bi-trash"></i>Delete
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Search functionality
        document.getElementById('searchInput').addEventListener('keyup', function() {
            const searchTerm = this.value.toLowerCase();
            const tableRows = document.querySelectorAll('table tbody tr');

            tableRows.forEach(row => {
                const content = row.querySelector('.question-content')?.textContent.toLowerCase() || '';

                if (content.includes(searchTerm)) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
