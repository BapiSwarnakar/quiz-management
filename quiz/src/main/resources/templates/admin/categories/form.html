<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/admin}">
<head>
    <title>Category Management</title>
    <style>
        :root {
            --primary-color: #0d6efd;
            --primary-dark: #0b5ed7;
            --success-color: #198754;
            --danger-color: #dc3545;
            --border-color: #e9ecef;
            --text-muted: #6c757d;
        }

        .page-header {
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .page-header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #2d3a4a;
            margin: 0;
        }

        .page-header p {
            color: var(--text-muted);
            font-size: 1rem;
            margin: 0.5rem 0 0 0;
        }

        .page-header-actions {
            display: flex;
            gap: 0.75rem;
        }

        /* Alert Styles */
        .alert {
            border: none;
            border-radius: 10px;
            padding: 1rem 1.25rem;
            margin-bottom: 1.5rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .alert-success {
            background: rgba(25, 135, 84, 0.1);
            color: var(--success-color);
            border-left: 4px solid var(--success-color);
        }

        .alert-danger {
            background: rgba(220, 53, 69, 0.1);
            color: var(--danger-color);
            border-left: 4px solid var(--danger-color);
        }

        .alert i {
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        /* Card Styles */
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        .card-header {
            background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
            border-bottom: 1px solid var(--border-color);
            padding: 1.5rem;
        }

        .card-header h5 {
            margin: 0;
            color: #2d3a4a;
            font-weight: 600;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-body {
            padding: 2rem;
        }

        .form-section {
            margin-bottom: 2rem;
        }

        .form-section:last-of-type {
            margin-bottom: 0;
        }

        .form-section-title {
            font-size: 1rem;
            font-weight: 600;
            color: #2d3a4a;
            margin-bottom: 1.25rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-section-title i {
            color: var(--primary-color);
            font-size: 1.1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            font-weight: 600;
            color: #2d3a4a;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .form-label .required {
            color: var(--danger-color);
            margin-left: 0.25rem;
        }

        .form-control,
        .form-select {
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
            outline: none;
        }

        .form-control::placeholder {
            color: #adb5bd;
        }

        .form-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.35rem;
            display: block;
        }

        /* Button Styles */
        .btn {
            font-weight: 600;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--primary-dark), #0a58ca);
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.3);
            transform: translateY(-2px);
            color: white;
        }

        .btn-secondary {
            background: #e9ecef;
            border: 1px solid var(--border-color);
            color: #495057;
        }

        .btn-secondary:hover {
            background: #dee2e6;
            border-color: #adb5bd;
            color: #212529;
        }

        .btn-back {
            background: #e9ecef;
            border: 1px solid var(--border-color);
            color: #495057;
            padding: 0.65rem 1.25rem;
        }

        .btn-back:hover {
            background: #dee2e6;
            border-color: #adb5bd;
            color: #212529;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
        }

        .button-group .btn {
            padding: 0.75rem 2rem;
        }

        /* Help Text */
        .help-text {
            background: rgba(13, 202, 240, 0.05);
            border-left: 4px solid #0dcaf0;
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .help-text i {
            color: #0dcaf0;
            margin-right: 0.5rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .page-header h1 {
                font-size: 1.5rem;
            }

            .page-header-actions {
                width: 100%;
            }

            .page-header-actions .btn {
                width: 100%;
                justify-content: center;
            }

            .card-body {
                padding: 1.5rem;
            }

            .button-group {
                flex-direction: column;
            }

            .button-group .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div layout:fragment="adminContent">
        <!-- Page Header -->
        <div class="page-header">
            <div>
                <h1>
                    <i th:if="${category.id == null}" class="bi bi-plus-circle me-2"></i>
                    <i th:unless="${category.id == null}" class="bi bi-pencil-square me-2"></i>
                    <span th:text="${category.id == null ? 'Create Category' : 'Edit Category'}">Category Form</span>
                </h1>
                <p th:text="${category.id == null ? 'Create a new category for organizing quizzes' : 'Update category information'}">Description</p>
            </div>
            <div class="page-header-actions">
                <a href="/admin/categories" class="btn btn-back">
                    <i class="bi bi-arrow-left"></i>Back to Categories
                </a>
            </div>
        </div>

        <!-- Success/Error Alerts -->
        <div th:if="${success}" class="alert alert-success" role="alert">
            <i class="bi bi-check-circle"></i>
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="alert alert-danger" role="alert">
            <i class="bi bi-exclamation-triangle"></i>
            <span th:text="${error}"></span>
        </div>

        <!-- Form Card -->
        <div class="card">
            <div class="card-header">
                <h5>
                    <i class="bi bi-form-check"></i>Category Information
                </h5>
            </div>
            <div class="card-body">
                <form th:action="@{/admin/categories/save}" method="post" th:object="${category}">
                    <input type="hidden" th:field="*{id}">
                    
                    <!-- Category Details Section -->
                    <div class="form-section">
                        <div class="form-section-title">
                            <i class="bi bi-info-circle"></i>
                            Category Details
                        </div>

                        <div class="form-group">
                            <label for="name" class="form-label">
                                Category Name
                                <span class="required">*</span>
                            </label>
                            <input type="text" class="form-control" id="name" th:field="*{name}" 
                                   placeholder="Enter category name" required>
                            <small class="form-text">
                                <i class="bi bi-info-circle me-1"></i>
                                This name will be displayed when creating quizzes
                            </small>
                        </div>

                        <div class="form-group">
                            <label for="description" class="form-label">
                                Description
                            </label>
                            <textarea class="form-control" id="description" th:field="*{description}" 
                                      placeholder="Enter category description" rows="4"></textarea>
                            <small class="form-text">
                                <i class="bi bi-info-circle me-1"></i>
                                Provide details about what this category covers
                            </small>
                        </div>
                    </div>

                    <!-- Help Information -->
                    <div class="help-text">
                        <i class="bi bi-lightbulb"></i>
                        <strong>Tip:</strong> Categories help organize quizzes by subject matter. Users will see these when selecting a quiz category.
                    </div>

                    <!-- Action Buttons -->
                    <div class="button-group">
                        <button type="submit" class="btn btn-primary">
                            <i th:if="${category.id == null}" class="bi bi-plus-circle"></i>
                            <i th:unless="${category.id == null}" class="bi bi-check-circle"></i>
                            <span th:text="${category.id == null ? 'Create Category' : 'Update Category'}">Save</span>
                        </button>
                        <a href="/admin/categories" class="btn btn-secondary">
                            <i class="bi bi-x-circle"></i>Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
