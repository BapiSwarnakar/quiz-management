<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin}">
<head>
    <title>Assign Permissions to Role</title>
    <style>
        :root {
            --primary-color: #0d6efd;
            --primary-dark: #0b5ed7;
            --success-color: #198754;
            --danger-color: #dc3545;
            --border-color: #e9ecef;
            --text-muted: #6c757d;
        }

        .page-header {
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .page-header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #2d3a4a;
            margin: 0;
        }

        .page-header .role-name {
            color: var(--primary-color);
            font-weight: 600;
        }

        .page-header p {
            color: var(--text-muted);
            font-size: 1rem;
            margin: 0.5rem 0 0 0;
        }

        .page-header-actions {
            display: flex;
            gap: 0.75rem;
        }

        /* Alert Styles */
        .alert {
            border: none;
            border-radius: 10px;
            padding: 1rem 1.25rem;
            margin-bottom: 1.5rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .alert-success {
            background: rgba(25, 135, 84, 0.1);
            color: var(--success-color);
            border-left: 4px solid var(--success-color);
        }

        .alert-danger {
            background: rgba(220, 53, 69, 0.1);
            color: var(--danger-color);
            border-left: 4px solid var(--danger-color);
        }

        .alert i {
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        /* Card Styles */
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        .card-header {
            background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
            border-bottom: 1px solid var(--border-color);
            padding: 1.5rem;
        }

        .card-header h5 {
            margin: 0;
            color: #2d3a4a;
            font-weight: 600;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-body {
            padding: 2rem;
        }

        .form-section {
            margin-bottom: 2rem;
        }

        .form-section:last-of-type {
            margin-bottom: 0;
        }

        .form-section-title {
            font-size: 1rem;
            font-weight: 600;
            color: #2d3a4a;
            margin-bottom: 1.5rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-section-title i {
            color: var(--primary-color);
            font-size: 1.1rem;
        }

        /* Permissions Container */
        .permissions-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
            max-height: none;
            overflow: visible;
            border: none;
            padding: 0;
        }

        .permission-item {
            background: #f8f9fa;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 1.25rem;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .permission-item:hover {
            border-color: var(--primary-color);
            background-color: rgba(13, 110, 253, 0.02);
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.1);
        }

        .permission-item.checked {
            border-color: var(--primary-color);
            background: rgba(13, 110, 253, 0.05);
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.15);
        }

        .form-check {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            margin: 0;
        }

        .form-check-input {
            width: 1.25em;
            height: 1.25em;
            margin-top: 0.25em;
            cursor: pointer;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .form-check-input:checked {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }

        .form-check-label {
            flex: 1;
            cursor: pointer;
            user-select: none;
            margin: 0;
        }

        .permission-name {
            font-weight: 600;
            color: #2d3a4a;
            display: block;
            margin-bottom: 0.35rem;
        }

        .permission-description {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: block;
            line-height: 1.4;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 2.5rem;
            color: #dee2e6;
            margin-bottom: 1rem;
            display: block;
        }

        /* Button Styles */
        .btn {
            font-weight: 600;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--primary-dark), #0a58ca);
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.3);
            transform: translateY(-2px);
            color: white;
        }

        .btn-secondary {
            background: #e9ecef;
            border: 1px solid var(--border-color);
            color: #495057;
        }

        .btn-secondary:hover {
            background: #dee2e6;
            border-color: #adb5bd;
            color: #212529;
        }

        .btn-back {
            background: #e9ecef;
            border: 1px solid var(--border-color);
            color: #495057;
            padding: 0.65rem 1.25rem;
        }

        .btn-back:hover {
            background: #dee2e6;
            border-color: #adb5bd;
            color: #212529;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .button-group .btn {
            padding: 0.75rem 2rem;
        }

        /* Select All Controls */
        .select-all-section {
            background: rgba(13, 110, 253, 0.05);
            border: 1px solid rgba(13, 110, 253, 0.2);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .select-all-section label {
            font-weight: 600;
            color: #2d3a4a;
            margin: 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .permission-count {
            background: var(--primary-color);
            color: white;
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .page-header h1 {
                font-size: 1.5rem;
            }

            .page-header-actions {
                width: 100%;
            }

            .page-header-actions .btn {
                width: 100%;
                justify-content: center;
            }

            .card-body {
                padding: 1.5rem;
            }

            .permissions-container {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }

            .button-group .btn {
                width: 100%;
                justify-content: center;
            }

            .select-all-section {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
<div layout:fragment="adminContent">
    <!-- Page Header -->
    <div class="page-header">
        <div>
            <h1>
                <i class="bi bi-key me-2"></i>Assign Permissions
            </h1>
            <p>Configure permissions for role: <span class="role-name" th:text="${role.name}"></span></p>
        </div>
        <div class="page-header-actions">
            <a th:href="@{/admin/roles}" class="btn btn-back">
                <i class="bi bi-arrow-left"></i>Back to Roles
            </a>
        </div>
    </div>

    <!-- Success/Error Messages -->
    <div th:if="${success}" class="alert alert-success" role="alert">
        <i class="bi bi-check-circle"></i>
        <span th:text="${success}"></span>
    </div>
    <div th:if="${error}" class="alert alert-danger" role="alert">
        <i class="bi bi-exclamation-triangle"></i>
        <span th:text="${error}"></span>
    </div>

    <!-- Permissions Card -->
    <div class="card">
        <div class="card-header">
            <h5><i class="bi bi-shield-check me-2"></i>Permission Management</h5>
        </div>
        <div class="card-body">
            <form th:action="@{/admin/roles/{id}/permissions/update(id=${role.id})}" method="post" id="permissionsForm">
                <input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}" th:if="${_csrf != null}" />
                
                <div class="form-section">
                    <div class="form-section-title">
                        <i class="bi bi-list-check"></i>
                        Available Permissions
                    </div>

                    <!-- Select All Section -->
                    <div th:if="${allPermissions.size() > 0}" class="select-all-section">
                        <label>
                            <input type="checkbox" id="selectAllPermissions" class="form-check-input" style="margin: 0;">
                            <span>Select All Permissions</span>
                        </label>
                        <span class="permission-count" th:text="${allPermissions.size()} + ' permissions'"></span>
                    </div>

                    <!-- Permissions Grid -->
                    <div th:if="${allPermissions.size() > 0}" class="permissions-container">
                        <div th:each="permission : ${allPermissions}" 
                             class="permission-item" 
                             th:classappend="${role.permissions.![id].contains(permission.id)} ? 'checked' : ''">
                            <div class="form-check">
                                <input class="form-check-input permission-checkbox" 
                                       type="checkbox" 
                                       name="permissionIds"
                                       th:value="${permission.id}" 
                                       th:id="'perm_' + ${permission.id}"
                                       th:checked="${role.permissions.![id].contains(permission.id)}">
                                <label class="form-check-label" th:for="'perm_' + ${permission.id}">
                                    <span class="permission-name" th:text="${permission.name}"></span>
                                    <span class="permission-description" 
                                          th:if="${permission.description}" 
                                          th:text="${permission.description}"></span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Empty State -->
                    <div th:unless="${allPermissions.size() > 0}" class="empty-state">
                        <i class="bi bi-inbox"></i>
                        <p>No permissions available. Please create some permissions first.</p>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="button-group">
                    <a th:href="@{/admin/roles}" class="btn btn-secondary">
                        <i class="bi bi-x-circle"></i>Cancel
                    </a>
                    <button type="submit" class="btn btn-primary" th:if="${allPermissions.size() > 0}">
                        <i class="bi bi-check-circle"></i>Save Permissions
                    </button>
                </div>
            </form>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const master = document.getElementById('selectAllPermissions');
            const items = document.querySelectorAll('.permission-item');
            
            if (items.length === 0) return;

            // Sync the master checkbox based on children
            function syncMaster() {
                if (!master) return;
                const cbs = Array.from(document.querySelectorAll('.permission-checkbox'));
                const checkedCount = cbs.filter(c => c.checked).length;
                master.checked = checkedCount === cbs.length;
                master.indeterminate = checkedCount > 0 && checkedCount < cbs.length;
            }

            // Master checkbox listener
            if (master) {
                master.addEventListener('change', function() {
                    const isChecked = this.checked;
                    items.forEach(item => {
                        const cb = item.querySelector('.permission-checkbox');
                        if (cb) {
                            cb.checked = isChecked;
                            if (isChecked) item.classList.add('checked');
                            else item.classList.remove('checked');
                        }
                    });
                });
            }

            // Individual item listeners
            items.forEach(item => {
                const cb = item.querySelector('.permission-checkbox');
                if (!cb) return;

                cb.addEventListener('change', function() {
                    if (this.checked) item.classList.add('checked');
                    else item.classList.remove('checked');
                    syncMaster();
                });

                // Card background click
                item.addEventListener('click', function(e) {
                    // Ignore clicks on the checkbox itself or the label
                    if (e.target.closest('.permission-checkbox') || e.target.closest('.form-check-label')) {
                        return;
                    }
                    
                    cb.checked = !cb.checked;
                    // Trigger change event manually
                    cb.dispatchEvent(new Event('change'));
                });
            });

            // Initial sync
            syncMaster();
        });
    </script>
</div>
</body>
</html>
