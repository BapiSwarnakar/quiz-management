<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/admin}">
<head>
    <title>Quiz Form</title>
    <style>
        :root {
            --primary-color: #0d6efd;
            --primary-dark: #0b5ed7;
            --success-color: #198754;
            --danger-color: #dc3545;
            --border-color: #e9ecef;
            --text-muted: #6c757d;
        }

        .page-header {
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .page-header h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #2d3a4a;
            margin: 0;
        }

        .page-header p {
            color: var(--text-muted);
            font-size: 1rem;
            margin: 0.5rem 0 0 0;
        }

        .page-header-actions {
            display: flex;
            gap: 0.75rem;
        }

        /* Alert Styles */
        .alert {
            border: none;
            border-radius: 10px;
            padding: 1rem 1.25rem;
            margin-bottom: 1.5rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .alert-success {
            background: rgba(25, 135, 84, 0.1);
            color: var(--success-color);
            border-left: 4px solid var(--success-color);
        }

        .alert-danger {
            background: rgba(220, 53, 69, 0.1);
            color: var(--danger-color);
            border-left: 4px solid var(--danger-color);
        }

        .alert i {
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        /* Card Styles */
        .card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            overflow: hidden;
        }

        .card-header {
            background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
            border-bottom: 1px solid var(--border-color);
            padding: 1.5rem;
        }

        .card-header h5 {
            margin: 0;
            color: #2d3a4a;
            font-weight: 600;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-body {
            padding: 2rem;
        }

        .form-section {
            margin-bottom: 2rem;
        }

        .form-section:last-of-type {
            margin-bottom: 0;
        }

        .form-section-title {
            font-size: 1rem;
            font-weight: 600;
            color: #2d3a4a;
            margin-bottom: 1.25rem;
            padding-bottom: 0.75rem;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-section-title i {
            color: var(--primary-color);
            font-size: 1.1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            font-weight: 600;
            color: #2d3a4a;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }

        .form-label .required {
            color: var(--danger-color);
            margin-left: 0.25rem;
        }

        .form-control,
        .form-select {
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
            outline: none;
        }

        .form-control::placeholder {
            color: #adb5bd;
        }

        .form-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.35rem;
            display: block;
        }

        /* Button Styles */
        .btn {
            font-weight: 600;
            border: none;
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--primary-dark), #0a58ca);
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.3);
            transform: translateY(-2px);
            color: white;
        }

        .btn-secondary {
            background: #e9ecef;
            border: 1px solid var(--border-color);
            color: #495057;
        }

        .btn-secondary:hover {
            background: #dee2e6;
            border-color: #adb5bd;
            color: #212529;
        }

        .btn-back {
            background: #e9ecef;
            border: 1px solid var(--border-color);
            color: #495057;
            padding: 0.65rem 1.25rem;
        }

        .btn-back:hover {
            background: #dee2e6;
            border-color: #adb5bd;
            color: #212529;
        }

        .button-group {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-color);
        }

        .button-group .btn {
            padding: 0.75rem 2rem;
        }

        /* Status Badge */
        .status-info {
            background: rgba(13, 110, 253, 0.05);
            border-left: 4px solid var(--primary-color);
            padding: 1rem;
            border-radius: 6px;
            margin-top: 1rem;
            font-size: 0.9rem;
        }

        .status-info i {
            color: var(--primary-color);
            margin-right: 0.5rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .page-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .page-header h1 {
                font-size: 1.5rem;
            }

            .page-header-actions {
                width: 100%;
            }

            .page-header-actions .btn {
                width: 100%;
                justify-content: center;
            }

            .card-body {
                padding: 1.5rem;
            }

            .button-group {
                flex-direction: column;
            }

            .button-group .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div layout:fragment="adminContent">
        <!-- Page Header -->
        <div class="page-header">
            <div>
                <h1>
                    <i th:if="${quiz.id == null}" class="bi bi-plus-circle me-2"></i>
                    <i th:unless="${quiz.id == null}" class="bi bi-pencil-square me-2"></i>
                    <span th:text="${quiz.id == null ? 'Create Quiz' : 'Edit Quiz'}">Quiz Form</span>
                </h1>
                <p th:text="${quiz.id == null ? 'Create a new quiz for your platform' : 'Update quiz information and settings'}">Description</p>
            </div>
            <div class="page-header-actions">
                <a href="/admin/quizzes" class="btn btn-back">
                    <i class="bi bi-arrow-left"></i>Back to Quizzes
                </a>
            </div>
        </div>

        <div th:if="${success}" class="alert alert-success" role="alert">
            <i class="bi bi-check-circle"></i>
            <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="alert alert-danger" role="alert">
            <i class="bi bi-exclamation-triangle"></i>
            <span th:text="${error}"></span>
        </div>

        <!-- Form Card -->
        <div class="card">
            <div class="card-header">
                <h5>
                    <i class="bi bi-form-check"></i>Quiz Information
                </h5>
            </div>
            <div class="card-body">
                <form th:action="${quiz.id == null ? '/admin/quizzes/create' : '/admin/quizzes/edit/' + quiz.id}" 
                      method="post" th:object="${quiz}">
                    <input type="hidden" th:field="*{id}">
                    
                    <!-- Basic Information Section -->
                    <div class="form-section">
                        <div class="form-section-title">
                            <i class="bi bi-info-circle"></i>
                            Basic Information
                        </div>

                        <div class="form-group">
                            <label for="title" class="form-label">
                                Quiz Title
                                <span class="required">*</span>
                            </label>
                            <input type="text" class="form-control" id="title" th:field="*{title}" 
                                   placeholder="Enter quiz title" required>
                        </div>

                        <div class="form-group">
                            <label for="description" class="form-label">
                                Description
                            </label>
                            <textarea class="form-control" id="description" th:field="*{description}" 
                                      placeholder="Enter quiz description" rows="4"></textarea>
                            <small class="form-text">
                                <i class="bi bi-info-circle me-1"></i>
                                Provide details about what this quiz covers
                            </small>
                        </div>
                    </div>

                    <!-- Configuration Section -->
                    <div class="form-section">
                        <div class="form-section-title">
                            <i class="bi bi-sliders"></i>
                            Quiz Configuration
                        </div>

                        <div class="row g-3">
                            <div class="col-12 col-md-6">
                                <div class="form-group">
                                    <label for="categoryId" class="form-label">
                                        Category
                                        <span class="required">*</span>
                                    </label>
                                    <select class="form-select" id="categoryId" name="categoryId" required>
                                        <option value="">Select a category</option>
                                        <option th:each="category : ${categories}" 
                                                th:value="${category.id}" 
                                                th:text="${category.name}"
                                                th:selected="${quiz.category != null && quiz.category.id == category.id}">
                                        </option>
                                    </select>
                                </div>
                            </div>

                            <div class="col-12 col-md-6">
                                <div class="form-group">
                                    <label for="timeInMinutes" class="form-label">
                                        Time Limit
                                        <span class="required">*</span>
                                    </label>
                                    <div class="input-group">
                                        <input type="number" class="form-control" id="timeInMinutes" 
                                               th:field="*{timeInMinutes}" min="1" placeholder="30" required>
                                        <span class="input-group-text">minutes</span>
                                    </div>
                                </div>
                            </div>

                            <div class="col-12 col-md-6">
                                <div class="form-group">
                                    <label for="totalMarks" class="form-label">
                                        Total Marks
                                        <span class="required">*</span>
                                    </label>
                                    <div class="input-group">
                                        <input type="number" class="form-control" id="totalMarks" 
                                               th:field="*{totalMarks}" min="1" placeholder="100" required>
                                        <span class="input-group-text">marks</span>
                                    </div>
                                </div>
                            </div>

                            <div class="col-12 col-md-6">
                                <div class="form-group">
                                    <label for="active" class="form-label">
                                        Status
                                    </label>
                                    <select class="form-select" id="active" th:field="*{active}">
                                        <option th:value="true">
                                            <i class="bi bi-check-circle"></i> Active
                                        </option>
                                        <option th:value="false">
                                            <i class="bi bi-x-circle"></i> Inactive
                                        </option>
                                    </select>
                                    <small class="form-text">
                                        <i class="bi bi-info-circle me-1"></i>
                                        Inactive quizzes won't be available for users
                                    </small>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Status Information -->
                    <div class="status-info">
                        <i class="bi bi-lightbulb"></i>
                        <strong>Tip:</strong> You can add questions to this quiz after creation.
                    </div>

                    <!-- Action Buttons -->
                    <div class="button-group">
                        <button type="submit" class="btn btn-primary">
                            <i th:if="${quiz.id == null}" class="bi bi-plus-circle"></i>
                            <i th:unless="${quiz.id == null}" class="bi bi-check-circle"></i>
                            <span th:text="${quiz.id == null ? 'Create Quiz' : 'Update Quiz'}">Save</span>
                        </button>
                        <a href="/admin/quizzes" class="btn btn-secondary">
                            <i class="bi bi-x-circle"></i>Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
