<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main}">
<head>
    <title>Quiz Review</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fc;
        }
        
        .card-dashboard {
            border: none;
            border-radius: 10px;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.05);
            margin-bottom: 1.5rem;
        }
        
        .card-header {
            background: linear-gradient(135deg, #0d6efd, #0b5ed7);
            color: white;
            border-bottom: none;
            padding: 1.5rem;
        }
        
        .card-header h5 {
            margin: 0;
            font-weight: 600;
        }
        
        .question-card {
            border: 2px solid #e9ecef;
            border-radius: 8px;
            transition: all 0.2s ease;
            margin-bottom: 1.5rem;
        }
        
        .question-card:hover {
            border-color: #0d6efd;
            box-shadow: 0 0.25rem 0.5rem rgba(13, 110, 253, 0.1);
        }
        
        .question-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #f0f6ff;
            color: #0d6efd;
            font-weight: 600;
            margin-right: 0.75rem;
        }
        
        .question-title {
            font-weight: 600;
            color: #212529;
            font-size: 1rem;
        }
        
        .badge-status {
            font-weight: 600;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
        }
        
        .answer-option {
            padding: 0.75rem 1rem;
            margin-bottom: 0.5rem;
            border-left: 3px solid #e9ecef;
            border-radius: 4px;
            transition: all 0.2s ease;
        }
        
        .answer-option.correct {
            border-left-color: #198754;
            background-color: rgba(25, 135, 84, 0.05);
            color: #198754;
            font-weight: 600;
        }
        
        .answer-option.incorrect {
            border-left-color: #dc3545;
            background-color: rgba(220, 53, 69, 0.05);
            color: #dc3545;
            font-weight: 600;
        }
        
        .answer-option.selected {
            border-left-color: #0d6efd;
            background-color: rgba(13, 110, 253, 0.05);
        }
        
        .form-check-label {
            cursor: pointer;
            margin-bottom: 0;
            width: 100%;
        }
        
        .btn-action {
            padding: 0.5rem 1.5rem;
            font-weight: 500;
            border-radius: 6px;
            min-width: 140px;
        }
        
        .btn-primary {
            background-color: #0d6efd;
            border-color: #0d6efd;
        }
        
        .btn-primary:hover {
            background-color: #0b5ed7;
            border-color: #0b5ed7;
        }
        
        .review-summary {
            background: linear-gradient(135deg, rgba(13, 110, 253, 0.05), rgba(11, 94, 215, 0.05));
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            border-left: 4px solid #0d6efd;
        }
        
        .review-summary h6 {
            color: #0d6efd;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <div class="container py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="h4 mb-0">Quiz Review</h2>
                    <p class="text-muted mb-0" th:text="'Review your answers for: ' + ${result.quiz.title}">Quiz review</p>
                </div>
                <div>
                    <span class="badge bg-primary rounded-pill" th:text="'Result ID: ' + ${result.id}">Result ID</span>
                </div>
            </div>

            <div class="review-summary">
                <h6><i class="bi bi-info-circle me-2"></i>Summary</h6>
                <div class="row g-3">
                    <div class="col-md-3">
                        <div>
                            <span class="small text-muted">Total Questions</span>
                            <div class="h5 mb-0 text-dark" th:text="${result.quiz.questions != null ? #lists.size(result.quiz.questions) : 0}">0</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div>
                            <span class="small text-success">Correct Answers</span>
                            <div class="h5 mb-0 text-success" th:text="${result.correctAnswers}">0</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div>
                            <span class="small text-danger">Wrong Answers</span>
                            <div class="h5 mb-0 text-danger" th:text="${result.wrongAnswers}">0</div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div>
                            <span class="small text-primary">Score</span>
                            <div class="h5 mb-0 text-primary" th:text="|${result.obtainedMarks}/${result.totalMarks}|">0/0</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card card-dashboard">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0">Detailed Review</h5>
                    <i class="bi bi-file-earmark-check fs-4"></i>
                </div>
                <div class="card-body">
                    <div th:each="question, stat : ${result.quiz.questions}" class="question-card">
                        <div class="card-body">
                            <div class="d-flex align-items-start justify-content-between mb-3">
                                <div class="d-flex align-items-start flex-grow-1">
                                    <span class="question-number" th:text="${stat.count}">1</span>
                                    <div>
                                        <h6 class="question-title mb-0" th:text="${question.content}">Question</h6>
                                    </div>
                                </div>
                                <span class="badge-status ms-3"
                                      th:classappend="${(answers != null and answers.get(question.id) != null) ? ((question.correctAnswer != null and answers.get(question.id) == question.correctAnswer.id) ? 'bg-success text-white' : 'bg-danger text-white') : 'bg-secondary text-white'}"
                                      th:text="${(answers != null and answers.get(question.id) != null) ? ((question.correctAnswer != null and answers.get(question.id) == question.correctAnswer.id) ? 'Correct' : 'Incorrect') : 'Not Attempted'}">
                                </span>
                            </div>

                            <div class="ms-5">
                                <small class="text-muted d-block mb-2">
                                    <i class="bi bi-check-circle me-1"></i>Correct Answer
                                </small>
                                <div class="answer-option correct mb-3" th:if="${question.correctAnswer != null}">
                                    <div class="form-check">
                                        <label class="form-check-label" th:text="${question.correctAnswer.content}">
                                            Correct answer
                                        </label>
                                    </div>
                                </div>

                                <small class="text-muted d-block mb-2" th:if="${answers != null and answers.get(question.id) != null}">
                                    <i class="bi bi-person-circle me-1"></i>Your Answer
                                </small>
                                <div th:each="answer : ${question.answers}"
                                     class="answer-option"
                                     th:if="${answers != null and answers.get(question.id) != null and answer.id == answers.get(question.id)}"
                                     th:classappend="${(question.correctAnswer != null and answer.id == question.correctAnswer.id) ? 'correct' : 'incorrect'}">
                                    <div class="form-check">
                                        <label class="form-check-label" th:text="${answer.content}">
                                            Your answer
                                        </label>
                                    </div>
                                </div>

                                <div th:unless="${answers != null and answers.get(question.id) != null}" class="alert alert-warning py-2 px-3 mb-0">
                                    <i class="bi bi-exclamation-circle me-1"></i>
                                    <small>You did not attempt this question</small>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mt-4">
                <a href="/dashboard" class="btn btn-outline-secondary btn-action">
                    <i class="bi bi-arrow-left me-1"></i> Back to Dashboard
                </a>
                <form th:action="@{/quiz/attempt/start/{id}(id=${result.quiz.id})}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-primary btn-action">
                        <i class="bi bi-arrow-clockwise me-1"></i> Retake Quiz
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
