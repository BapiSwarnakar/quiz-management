<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
    <title>Quiz Result</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .card-dashboard {
            border: none;
            border-radius: 10px;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease;
            margin-bottom: 1.5rem;
        }
        .card-header {
            background: linear-gradient(135deg, #0d6efd, #0b5ed7);
            color: white;
            border-bottom: none;
        }
        .card-header h5 {
            margin: 0;
            font-weight: 600;
        }
        .metric-card {
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
        }
        .metric-card h6 {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            color: #6c757d;
            margin-bottom: 0.5rem;
        }
        .metric-card h3 {
            margin: 0;
            font-weight: 700;
            font-size: 1.8rem;
        }
        .score-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(13, 110, 253, 0.1), rgba(11, 94, 215, 0.1));
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            margin: 0 auto;
        }
        .score-circle .percentage {
            font-size: 2rem;
            font-weight: 700;
            color: #0d6efd;
        }
        .score-circle .label {
            font-size: 0.8rem;
            color: #6c757d;
            margin-top: 0.5rem;
        }
        .progress {
            height: 10px;
            border-radius: 8px;
        }
        .btn-quiz {
            padding: 0.4rem 1rem;
            font-weight: 500;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <div class="container py-4">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="h4 mb-0">Quiz Result</h2>
                    <p class="text-muted mb-0">Summary of your assessment performance</p>
                </div>
                <div>
                    <span class="badge bg-primary rounded-pill" th:text="'Result ID: ' + ${result.id}">Result ID</span>
                </div>
            </div>

            <div class="card card-dashboard">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h5 class="mb-0" th:text="${result.quiz.title}">Quiz Title</h5>
                    <i class="bi bi-bar-chart-line-fill fs-4"></i>
                </div>
                <div class="card-body">
                    <div class="row g-4 mb-4">
                        <div class="col-lg-3">
                            <div class="score-circle">
                                <div th:if="${result.totalMarks > 0}" class="percentage" th:text="${result.obtainedMarks * 100 / result.totalMarks} + '%'">0%</div>
                                <div th:unless="${result.totalMarks > 0}" class="percentage">0%</div>
                                <div class="label">Overall Score</div>
                            </div>
                        </div>

                        <div class="col-lg-3">
                            <div class="metric-card bg-primary bg-opacity-10">
                                <h6>Total Marks</h6>
                                <h3 th:text="${result.totalMarks}">0</h3>
                            </div>
                        </div>

                        <div class="col-lg-3">
                            <div class="metric-card bg-success bg-opacity-10">
                                <h6>Correct Answers</h6>
                                <h3 th:text="${result.correctAnswers}">0</h3>
                            </div>
                        </div>

                        <div class="col-lg-3">
                            <div class="metric-card bg-danger bg-opacity-10">
                                <h6>Wrong Answers</h6>
                                <h3 th:text="${result.wrongAnswers}">0</h3>
                            </div>
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6">
                            <div class="metric-card bg-light">
                                <h6>Obtained Marks</h6>
                                <h3 th:text="${result.obtainedMarks}">0</h3>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div>
                                <label class="form-label fw-600">Accuracy Progress</label>
                                <div class="progress">
                                    <div class="progress-bar" role="progressbar"
                                         th:if="${result.totalMarks > 0}"
                                         th:style="${'width:' + (result.obtainedMarks * 100 / result.totalMarks) + '%'}"
                                         th:attr="aria-valuenow=${result.obtainedMarks * 100 / result.totalMarks}"
                                         aria-valuemin="0" aria-valuemax="100"></div>
                                    <div class="progress-bar" role="progressbar"
                                         th:unless="${result.totalMarks > 0}"
                                         style="width:0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <a href="/dashboard" class="btn btn-outline-secondary btn-quiz">
                            <i class="bi bi-house-fill me-1"></i> Back to Dashboard
                        </a>
                        <a th:href="@{/quiz/review/{id}(id=${result.id})}" class="btn btn-primary btn-quiz">
                            <i class="bi bi-file-text me-1"></i> Review Answers
                        </a>
                    </div>
                </div>
                <div class="card-footer bg-transparent border-top text-end">
                    <small class="text-muted">Quiz completed successfully</small>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
