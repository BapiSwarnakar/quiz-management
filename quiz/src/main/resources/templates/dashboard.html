<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/main}">
<head>
    <title>Dashboard - Quiz Management</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        .card-dashboard {
            border: none;
            border-radius: 10px;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease;
            margin-bottom: 1.5rem;
        }
        .card-dashboard:hover {
            transform: translateY(-5px);
        }
        .card-header {
            background: linear-gradient(135deg, #0d6efd, #0b5ed7);
            color: white;
            border-bottom: none;
        }
        .btn-quiz {
            padding: 0.4rem 1rem;
            font-weight: 500;
            border-radius: 6px;
        }
        .quiz-table {
            --bs-table-striped-bg: rgba(13, 110, 253, 0.03);
        }
        .quiz-table th {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            color: #6c757d;
            border-bottom-width: 1px;
        }
        .no-quizzes {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
        }
        .quiz-title {
            font-weight: 600;
            color: #212529;
        }
        .quiz-category {
            color: #6c757d;
            font-size: 0.9rem;
        }
        .quiz-duration {
            color: #0d6efd;
            font-weight: 500;
        }
        .card-header h5 {
            margin: 0;
            font-weight: 600;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="h4 mb-0">Active Quizzes</h2>
                <p class="text-muted mb-0">Select a quiz to begin your assessment</p>
            </div>
            <div>
                <span class="badge bg-primary rounded-pill" th:text="'Total: ' + ${activeQuizzes != null ? #lists.size(activeQuizzes) : 0}"></span>
            </div>
        </div>

        <div class="card card-dashboard">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="mb-0">Available Quizzes</h5>
                <i class="bi bi-list-task fs-4"></i>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table quiz-table table-hover mb-0">
                        <thead class="bg-light">
                            <tr>
                                <th class="ps-4">Title</th>
                                <th>Category</th>
                                <th>Duration</th>
                                <th class="text-end pe-4">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="quiz : ${activeQuizzes}" class="align-middle">
                                <td class="ps-4">
                                    <div class="d-flex align-items-center">
                                        <div class="bg-primary bg-opacity-10 rounded p-2 me-3">
                                            <i class="bi bi-question-square text-primary"></i>
                                        </div>
                                        <div>
                                            <div class="quiz-title" th:text="${quiz.title}">Quiz Title</div>
                                            <div class="quiz-category" th:if="${quiz.category != null}" th:text="${quiz.category.name}">Category</div>
                                        </div>
                                    </div>
                                </td>
                                <td>
                                    <span class="badge bg-light text-dark" th:if="${quiz.category != null}" th:text="${quiz.category.name}">Category</span>
                                    <span class="badge bg-light text-muted" th:unless="${quiz.category != null}">—</span>
                                </td>
                                <td class="quiz-duration" th:text="|${quiz.timeInMinutes} min|">Duration</td>
                                <td class="text-end pe-4">
                                    <form th:action="@{/quiz/attempt/start/{id}(id=${quiz.id})}" method="post" class="d-inline">
                                        <button type="submit" class="btn btn-primary btn-quiz">
                                            <i class="bi bi-play-fill me-1"></i> Start Quiz
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${activeQuizzes == null or #lists.isEmpty(activeQuizzes)}">
                                <td colspan="4" class="text-center py-5">
                                    <div class="no-quizzes">
                                        <i class="bi bi-inbox text-muted" style="font-size: 2.5rem;"></i>
                                        <h5 class="mt-3 mb-2">No Active Quizzes</h5>
                                        <p class="text-muted mb-0">There are currently no quizzes available. Please check back later.</p>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer bg-transparent border-top-0 text-end">
                <small class="text-muted">Showing <span th:text="${activeQuizzes != null ? #lists.size(activeQuizzes) : 0}">0</span> quizzes</small>
            </div>
        </div>
    </div>

    <script>
        // Add any interactive functionality here
        document.addEventListener('DOMContentLoaded', function() {
            // Add any client-side interactions if needed
        });
    </script>
</div>
</body>
</html>
